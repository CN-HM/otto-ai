name: flutter_app_core
description: Shared Flutter application layer for ai AI apps
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  openapi:
    path: ../openapi
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_reactive_ble: ^5.4.2
  permission_handler: ^11.3.1
  intl: ^0.20.2
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
